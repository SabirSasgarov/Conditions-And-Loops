<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Drag and Drop Sort</title>
  </head>
  <body>
    <div class="container d-flex justify-content-center">
      <div class="form-div d-flex flex-column justify-content-center align-items-center">
        <div class="d-flex justify-content-start w-75 bg-success p-2 mb-3">
          <h1>Somewhere</h1>
        </div>
        <form>
            <div class="mb-1">
            <label for="username" class="form-label"
              >Username</label
            >
            <input
              type="text"
              class="form-control"
              id="username"
              aria-describedby="usernameHelp"
            />
            <div id="usernameHelp" class="form-text text-danger visible">
              Username cannot be blank.
            </div>
          </div>
          <div class="mb-1">
            <label for="email" class="form-label"
              >Email address</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              aria-describedby="emailHelp"
            />
            <div id="emailHelp" class="form-text text-danger visible">
              Email cannot be blank.
            </div>
          </div>
          <div class="mb-1">
            <label for="exampleInputPassword1" class="form-label"
              >Password</label
            >
            <input
              type="password"
              class="form-control"
              id="exampleInputPassword1"
            />
            <div id="passwordHelp" class="form-text text-danger visible">
              Password cannot be blank.
            </div>
          </div>
         <div class="mb-1">
            <label for="submitPassword" class="form-label"
              >Submit-Password</label
            >
            <input
              type="password"
              class="form-control"
              id="submitPassword"
            />
            <div id="submitPasswordHelp" class="form-text text-danger visible">
              Password cannot be blank.
            </div>
          </div>
          <div class="d-flex justify-content-center">
          <button type="submit" id="submit-btn" class="btn btn-primary px-5">Send</button>
          </div>
        </form>
      </div>
    </div>
  </body>
  <script src="./assets/js/script.js"></script>
</html>
